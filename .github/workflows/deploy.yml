
name: AWS ECS CI/CD Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: web-database-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Prepare ECS Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition web-database-task \
            --query taskDefinition \
            > ecs-task-definition.json

          jq --arg IMAGE "$IMAGE_URI" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            | .containerDefinitions |= map(if .name == "web" then .image = $IMAGE else . end)' \
            ecs-task-definition.json > new-task-definition.json

      - name: Register New Task Definition
        id: register
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Deploy to Amazon ECS
        run: |
          aws ecs update-service \
            --cluster web-database-cluster \
            --service web-database-service \
            --task-definition "$TASK_DEF_ARN" \
            --region ${{ secrets.AWS_REGION }}

      - name: Wait for Deployment
        run: |
          aws ecs wait services-stable \
            --cluster web-database-cluster \
            --services web-database-service \
            --region ${{ secrets.AWS_REGION }}

      - name: Deployment Successful
        run: echo "Application deployed successfully to AWS ECS!"
